name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the run in flight irrelevant; cancelling it frees
# a runner instead of paying for an answer nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails rather than silently resolving a different tree
      # than the one that was reviewed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Integration tests run against PGlite — Postgres compiled to WebAssembly
      # and embedded in the test process — so CI needs no database service.
      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The invariants live in hand-written SQL, so "does it still apply from
    # empty?" is a question worth asking on every change — against a real
    # Postgres, not the embedded one the tests use.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: obol
          POSTGRES_PASSWORD: obol
          POSTGRES_DB: obol_ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://obol:obol@localhost:5432/obol_ledger?sslmode=disable

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm run db:migrate

      # The seed asserts its own trial balance, so a green run here proves the
      # schema and the domain agree on a month of real traffic.
      - name: Seed and verify the books balance
        run: pnpm run db:seed

      - name: Re-running migrations is a no-op
        run: pnpm run db:migrate
