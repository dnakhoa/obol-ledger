name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the run in flight irrelevant; cancelling it frees
# a runner instead of paying for an answer nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Raised from 10 when the suite passed 600 tests and started running into
    # the cap. Most of the time is PGlite: every integration file boots its own
    # Postgres so row-level security is actually enforced during tests, which
    # is worth several minutes of wall clock.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails rather than silently resolving a different tree
      # than the one that was reviewed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Integration tests run against PGlite — Postgres compiled to WebAssembly
      # and embedded in the test process — so CI needs no database service.
      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  postgres:
    name: 'Postgres: migrations and concurrency'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Two things need a real server rather than the embedded Postgres the main
    # suite runs on: that the hand-written invariant SQL still applies from
    # empty, and every claim this codebase makes about *concurrency* — lock
    # ordering, lost updates, idempotent retries under a genuine race.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: obol
          POSTGRES_PASSWORD: obol
          POSTGRES_DB: obol_ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://obol:obol@localhost:5432/obol_ledger?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm run db:migrate

      # The seed asserts its own trial balance, so a green run here proves the
      # schema and the domain agree on a month of real traffic.
      - name: Seed and verify the books balance
        run: pnpm run db:seed

      - name: Re-running migrations is a no-op
        run: pnpm run db:migrate

      # PGlite is one connection, so it cannot express two transactions racing.
      # These suites open real ones. Without CONCURRENCY_DATABASE_URL they skip,
      # which keeps `pnpm test` green for a contributor with no Postgres — so CI
      # is the thing that guarantees the claims are actually checked.
      - name: Concurrency
        run: pnpm run test:concurrency
        env:
          CONCURRENCY_DATABASE_URL: postgresql://obol:obol@localhost:5432/obol_ledger?sslmode=disable
