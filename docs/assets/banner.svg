.l10{opacity:0;animation:l10 16.0s ease-out infinite}
@keyframes s0{0%,10.00%{fill:#232a39}11.25%,94%{fill:#3fbf8a}100%{fill:#232a39}}
.s0{animation:s0 16.0s ease-out infinite}
@keyframes s1{0%,15.00%{fill:#232a39}16.25%,94%{fill:#3fbf8a}100%{fill:#232a39}}
.s1{animation:s1 16.0s ease-out infinite}
