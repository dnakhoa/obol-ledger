name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request makes the run in flight irrelevant; cancelling
# it frees a runner instead of paying for an answer nobody will read.
#
# Pull requests only. The group used to be the ref, which put back-to-back
# merges to main in one group too — and the second cancelled the first, so a
# commit could land on main that CI never finished checking. On main every
# run is its own group (`run_id`), so every commit there gets a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Three jobs side by side rather than one after another: the wall clock is the
# slowest of them, not their sum.
jobs:
  checks:
    name: 'Checks: format, lint, types, build'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails rather than silently resolving a different tree
      # than the one that was reviewed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Next.js reuses compiled output between builds from `.next/cache`; this
      # is the cache its CI guide describes, keyed on the lockfile and the
      # sources so a change to either starts from the nearest older cache.
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    # Ten minutes is several times what the suite takes. It is a guard against
    # a hang, not a budget: a suite that starts needing it is a regression to
    # investigate, not a cap to raise.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Integration tests run against PGlite — Postgres compiled to WebAssembly
      # and embedded in the test process — so CI needs no database service.
      # Every test gets a Postgres of its own, loaded from one migrated
      # snapshot (tests/helpers/database-template.ts), and test files run in
      # parallel across the runner's cores.
      - name: Test
        run: pnpm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  postgres:
    name: 'Postgres: migrations and concurrency'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Two things need a real server rather than the embedded Postgres the main
    # suite runs on: that the hand-written invariant SQL still applies from
    # empty, and every claim this codebase makes about *concurrency* — lock
    # ordering, lost updates, idempotent retries under a genuine race.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: obol
          POSTGRES_PASSWORD: obol
          POSTGRES_DB: obol_ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://obol:obol@localhost:5432/obol_ledger?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm run db:migrate

      # The seed asserts its own trial balance, so a green run here proves the
      # schema and the domain agree on a month of real traffic.
      - name: Seed and verify the books balance
        run: pnpm run db:seed

      - name: Re-running migrations is a no-op
        run: pnpm run db:migrate

      # PGlite is one connection, so it cannot express two transactions racing.
      # These suites open real ones. Without CONCURRENCY_DATABASE_URL they skip,
      # which keeps `pnpm test` green for a contributor with no Postgres — so CI
      # is the thing that guarantees the claims are actually checked.
      - name: Concurrency
        run: pnpm run test:concurrency
        env:
          CONCURRENCY_DATABASE_URL: postgresql://obol:obol@localhost:5432/obol_ledger?sslmode=disable
