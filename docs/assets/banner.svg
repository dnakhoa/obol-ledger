<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
<title id="t">Obol Ledger</title>
<desc id="d">A double-entry ledger whose invariants live in Postgres. A psql session tries to rewrite history, post an unbalanced entry, delete an entry and write into another tenant; Postgres refuses each one and nothing is kept.</desc>
<style>
.bg{fill:#0d1017}
.panel{fill:#131722;stroke:#262c3b}
.bar{fill:#1a1f2d}
.dot{fill:#2e3547}
.title{font:700 46px ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#f3f5f9;letter-spacing:-1px}
.lede{font:400 19px ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9aa3b5}
.tag{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c7cede}
