.s7{animation:s7 16.0s ease-out infinite}
@keyframes s8{0%,56.25%{fill:#232a39}57.50%,94%{fill:#3fbf8a}100%{fill:#232a39}}
.s8{animation:s8 16.0s ease-out infinite}</style>
<rect class="bg" width="1280" height="440" rx="18"/>
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#161b26" stroke-width="1"/></pattern><radialGradient id="glow" cx="0.2" cy="0.1" r="0.9"><stop offset="0" stop-color="#3b4cff" stop-opacity="0.18"/><stop offset="1" stop-color="#3b4cff" stop-opacity="0"/></radialGradient></defs>
<rect width="1280" height="440" rx="18" fill="url(#g)"/>
<rect width="1280" height="440" rx="18" fill="url(#glow)"/>
<g transform="translate(56,64)"><rect width="44" height="44" rx="11" fill="#f3f5f9"/><g transform="translate(10,10)" fill="none" stroke="#131722" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M7 20h10M5 8h14M5 8l-3 6h6ZM19 8l-3 6h6Z"/></g><text x="60" y="31" style="font:600 22px ui-sans-serif,-apple-system,'Segoe UI',Inter,sans-serif;fill:#f3f5f9">Obol Ledger</text></g>
<text class="title" x="56" y="178">Balanced by construction.</text>
<text class="title" x="56" y="232" style="fill:#8ea8ff">Refused by Postgres.</text>
<text class="lede" x="56" y="278">A double-entry ledger whose every invariant lives in the</text>
<text class="lede" x="56" y="304">database — and a live page that dares you to break it.</text>
<rect class="chip" x="56" y="340" width="114" height="30" rx="15"/>
<text class="tag" x="66" y="360">Postgres 15+</text>
<rect class="chip" x="180.2" y="340" width="98" height="30" rx="15"/>
<text class="tag" x="190" y="360">Next.js 16</text>
<rect class="chip" x="288.7" y="340" width="153" height="30" rx="15"/>
<text class="tag" x="299" y="360">TypeScript strict</text>
<rect class="chip" x="452.15" y="340" width="44" height="30" rx="15"/>
<text class="tag" x="462" y="360">RLS</text>
<rect class="chip" x="505.7" y="340" width="114" height="30" rx="15"/>
<text class="tag" x="516" y="360">1,100+ tests</text>
<rect class="panel" x="640" y="40" width="596" height="360" rx="12"/>
<path class="bar" d="M641 74V52a11 11 0 0 1 11-11h572a11 11 0 0 1 11 11V74Z"/>
<circle class="dot" cx="660" cy="58" r="5"/>
<circle class="dot" cx="676" cy="58" r="5"/>
<circle class="dot" cx="692" cy="58" r="5"/>
<text class="cap" x="716" y="62">psql — obol_app · NOSUPERUSER NOBYPASSRLS</text>
<text class="mono prompt l0" x="658" y="102" xml:space="preserve">obol=&gt; UPDATE postings SET amount_minor = amount_minor * 10 …;</text>
<text class="mono error l1" x="658" y="123" xml:space="preserve">ERROR:  23001 restrict_violation</text>
<text class="mono detail l2" x="722" y="144" xml:space="preserve">postings is append-only; UPDATE is not permitted.</text>
<text class="mono prompt l3" x="658" y="175" xml:space="preserve">obol=&gt; SET CONSTRAINTS ALL IMMEDIATE;  -- as COMMIT would</text>
<text class="mono error l4" x="658" y="196" xml:space="preserve">ERROR:  23514 check_violation</text>
<text class="mono detail l5" x="722" y="217" xml:space="preserve">transaction txn_01M3… is unbalanced by 1 minor units</text>
<text class="mono prompt l6" x="658" y="248" xml:space="preserve">obol=&gt; INSERT INTO accounts … 'org_SOMEONE_ELSE' …;</text>
<text class="mono error l7" x="658" y="269" xml:space="preserve">ERROR:  42501 insufficient_privilege</text>
<text class="mono detail l8" x="722" y="290" xml:space="preserve">new row violates row-level security policy</text>
<text class="mono prompt l9" x="658" y="321" xml:space="preserve">obol=&gt; ROLLBACK;</text>
<text class="mono ok l10" x="658" y="342" xml:space="preserve">Rows kept: 0</text>
<rect class="cursor" x="658" y="355" width="8" height="15"/>
<text class="score" x="658" y="374">9 of 9 attacks refused</text>
