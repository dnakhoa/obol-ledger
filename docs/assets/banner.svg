.mono{font:400 13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.prompt{fill:#d7dcea}
.error{fill:#ff7b72;font-weight:700}
.detail{fill:#f0a8a2}
.ok{fill:#56d8a4;font-weight:700}
.cap{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6f7890}
