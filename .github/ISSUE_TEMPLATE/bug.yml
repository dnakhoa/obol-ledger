name: Bug report
description: Something behaves differently from what the docs claim
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is exploitable, please use a
        [private security advisory](https://github.com/dnakhoa/obol-ledger/security/advisories/new)
        instead — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      description: Quote the README, an ADR or an API response if one makes the claim.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: |
        Include the `x-request-id` from the response header if this came
        through the API — it resolves to a single request in the logs without
        a timestamp search.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A curl command or a failing test is ideal.
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where
      description: The live demo, or a local checkout at which commit?
      placeholder: https://obol-ledger.vercel.app
