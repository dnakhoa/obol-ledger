.l6{opacity:0;animation:l6 16.0s ease-out infinite}
@keyframes l7{0%,46.25%{opacity:0;transform:translateY(4px)}47.81%,94%{opacity:1;transform:none}100%{opacity:0}}
.l7{opacity:0;animation:l7 16.0s ease-out infinite}
